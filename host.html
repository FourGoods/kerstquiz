            padding: 20px;

            overflow-x: hidden;
            position: relative;

            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px #fff;
            user-select: none;
            animation: fall linear infinite;

            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }

            max-width: 800px;
            text-align: center;
            border: 3px solid var(--card-border);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(8px);
        }

        .card-decor-top {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: url("elementen/host/gouden_cadeau.png") no-repeat center center;
            background-size: contain;
            z-index: 10;

            gap: 15px;

            max-width: 160px;
            background: rgba(0, 0, 0, 0.3);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .progress-bar {
            height: 100%;
            background: var(--primary-yellow);
            width: 0%;
            transition: width 0.3s ease;
        }

        .vraag-titel-badge {
            background: #193829;
            border: 2px solid var(--card-border);
            padding: 8px 22px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .vraag-titel-badge .hoofd {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
        }
        .vraag-titel-badge .sub {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .timer-klok {
            background: #193829;
            border: 2px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: 900;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 90px;
            justify-content: center;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .btn-geel {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 25px 0 10px 0;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0a1710;
            border: 2px solid #fef3c7;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }
        .btn-geel:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6); }

            margin: 15px 0 0 0;
            background-color: #8b0000;
            color: white;
            border: 2px solid rgba(212, 175, 55, 0.5);

            background: #991b1b;
            color: #fff;
            transform: scale(1.05);

</head>

    let huidigeVraagIndex = -1;
    let toonLeaderboardStap = false;
    let actieveDeelnemers = [];
    let ingezondenCount = 0;
    let totaalDeelnemersCount = 0;
    let quizAntwoorden = {};
    let vraagIsActief = false;

    let timerInterval = null;
    let overgeblevenTijd = 45;

    socket.on('update-status', (data) => {
        huidigeVraagIndex = data.huidigeVraagIndex;
        toonLeaderboardStap = data.toonEindstand;
        actieveDeelnemers = data.actieveDeelnemers;
        renderHostScherm();
    });

    socket.on('zet-vraag', (nieuweIndex) => {
        huidigeVraagIndex = nieuweIndex;
        toonLeaderboardStap = false;
        vraagIsActief = false;
        setTimeout(() => { vraagIsActief = true; }, 800);
        renderHostScherm();
    });

    socket.on('update-deelnemers', (deelnemersLijst) => {
        actieveDeelnemers = deelnemersLijst;
        updateLobbyDeelnemers();
    });

        if (data.alleAntwoorden) {
            quizAntwoorden = data.alleAntwoorden;
        }

        if (data.vraagIndex === huidigeVraagIndex) {
            ingezondenCount = data.aantal;
            totaalDeelnemersCount = data.totaal;
            
            const statusEl = document.getElementById("ingediend-status");
            if (statusEl) {
                statusEl.innerText = `Ingezonden antwoorden: ${ingezondenCount} / ${totaalDeelnemersCount}`;

    });

    socket.on('quiz-gereset', () => {
        huidigeVraagIndex = -1;
        toonLeaderboardStap = false;
        actieveDeelnemers = [];
        quizAntwoorden = {};
        vraagIsActief = false;
        if (timerInterval) clearInterval(timerInterval);
        renderHostScherm();
    });

    function updateLobbyDeelnemers() {
        const lijstContainer = document.getElementById("deelnemers-lijst-container");
        if (!lijstContainer) return;

        if (actieveDeelnemers.length === 0) {
            lijstContainer.innerHTML = "<em style='color:var(--text-muted);'>Nog geen deelnemers aangesloten...</em>";
            return;
        }

        lijstContainer.innerHTML = actieveDeelnemers.map(naam => `<div class="deelnemer-tag">🌟 ${naam}</div>`).join("");
    }

    function startQuiz() {
        huidigeVraagIndex = 0;
        socket.emit('volgende-vraag', huidigeVraagIndex);
    }

    function resetQuiz() {
        if (confirm("Weet je zeker dat je de kerstquiz wilt herstarten? Alle voortgang wordt gereset.")) {
            socket.emit('reset-quiz');
        }
    }

    function volgendeVraag() {
        if (timerInterval) clearInterval(timerInterval);
        huidigeVraagIndex++;
        socket.emit('volgende-vraag', huidigeVraagIndex);
    }

    function toonEinduitslag() {
        toonLeaderboardStap = true;
        socket.emit('toon-eindstand');
        renderHostScherm();
    }

    function startTimer() {
        overgeblevenTijd = 45;
        const timerEl = document.getElementById("timer-display");
        const progressBar = document.getElementById("progress-bar-fill");
        
        if (timerEl) timerEl.innerText = `${overgeblevenTijd}s`;
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            overgeblevenTijd--;
            if (timerEl) timerEl.innerText = `${overgeblevenTijd}s`;
            
            if (progressBar) {
                let percentage = ((45 - overgeblevenTijd) / 45) * 100;
                progressBar.style.width = `${percentage}%`;
            }

            if (overgeblevenTijd <= 0) {
                clearInterval(timerInterval);
                volgendeVraag();
            }
        }, 1000);
    }

    // Geavanceerde spelfoutfunctie inclusief controle op omgedraaide letters (transponering)
    function vergelijkMetSpelfout(gegeven, juist) {
        let a = String(gegeven || "").trim().toLowerCase();
        let b = String(juist || "").trim().toLowerCase();
        
        // Verwijder een eventuele punt aan het begin of einde indien aanwezig
        a = a.replace(/^[.]+|[.]+$/g, "").trim();
        b = b.replace(/^[.]+|[.]+$/g, "").trim();

        if (a === b) return true;

        // Controleer of er exact twee aangrenzende letters zijn omgedraaid (bijv. Sniterklaas <-> Sinterklaas)
        if (a.length === b.length) {
            let diffs = [];
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) diffs.push(i);
            }
            if (diffs.length === 2 && diffs[1] === diffs[0] + 1) {
                if (a[diffs[0]] === b[diffs[1]] && a[diffs[1]] === b[diffs[0]]) {
                    return true;
                }
            }
        }

        if (Math.abs(a.length - b.length) > 1) return false;
        
        let levenshtein = (str1, str2) => {
            let track = Array(str2.length + 1).fill(null).map(() =>
                Array(str1.length + 1).fill(null));
            for (let i = 0; i <= str1.length; i += 1) { track[0][i] = i; }
            for (let j = 0; j <= str2.length; j += 1) { track[j][0] = j; }
            for (let j = 1; j <= str2.length; j += 1) {
                for (let i = 1; i <= str1.length; i += 1) {
                    let indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1,
                        track[j - 1][i] + 1,
                        track[j - 1][i - 1] + indicator
                    );
                }
            }
            return track[str2.length][str1.length];
        };

        return levenshtein(a, b) <= 1;
    }

    function isAntwoordJuistHost(index, antw) {
        if (!antw) return false;
        let a = String(antw).trim().toLowerCase();

        switch(index) {
            // Ronde 1
            case 0: return a.startsWith("b") || a.includes("duitsland");
            case 1: return a.startsWith("c") || a === "4";
            case 2: return a.startsWith("a") || a.includes("mexico");
            case 3: return vergelijkMetSpelfout(a, "Sinterklaas");
            case 4: return a === "6" || a.includes("zes");
            case 5: return vergelijkMetSpelfout(a, "Drenthe");
            case 6: return a.includes("waar") && !a.includes("niet");
            case 7: return a.includes("niet waar");

            // Ronde 8
            case 8:
                let num1 = parseFloat(a.replace(/[^0-9.]/g, ''));
                if (num1 < 100) num1 = num1 * 1000000;
                return !isNaN(num1) && num1 >= 2250000 && num1 <= 2750000;
            case 9:
                let num2 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num2) && num2 >= 300 && num2 <= 350;
            case 10: return a.replace(/[^a-z]/gi, '').toLowerCase() === "bdca";
            case 11: return a.replace(/[^a-z]/gi, '').toLowerCase() === "dbac";
            case 12: return a.includes("waar") && !a.includes("niet");
            case 13: return a.includes("niet waar");
            case 14:
                let num6 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num6) && num6 >= 80 && num6 <= 90;
            case 15:
                let num7 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num7) && num7 >= 20 && num7 <= 30;
            case 16: return a.startsWith("c") || a.includes("drenthe");
            case 17: return a.startsWith("c") || a.includes("23");
            case 18: return a.startsWith("a") || a.includes("44,7");
            case 19: return a.startsWith("c") || a.includes("30–40");
            default: return false;
        }
    }

    function renderHostScherm() {
        const hostContent = document.getElementById("host-content");

        if (huidigeVraagIndex < 0) {
            hostContent.innerHTML = `
                <h1>Kerstquiz Host Lobby</h1>
                <p style="color:var(--text-muted); font-size: 15px;">Laat deelnemers onderstaande QR-code scannen of open <strong>deelnemer.html</strong>:</p>
                <div id="qr-container"></div>
                <div style="font-weight: 800; margin-top: 10px; color:var(--accent-gold);">Actieve Deelnemers in de Lobby:</div>
                <div class="deelnemers-lijst" id="deelnemers-lijst-container">
                    <em style='color:var(--text-muted);'>Nog geen deelnemers aangesloten...</em>
                </div>
                <button class="btn-rood" onclick="startQuiz()">Start Quiz 🚀</button>
            `;

            setTimeout(() => {
                const qrEl = document.getElementById("qr-container");
                if (qrEl) {
                    qrEl.innerHTML = "";
                    new QRCode(qrEl, {
                        text: window.location.origin + "/deelnemer.html",
                        width: 160,
                        height: 160
                    });
                }
                updateLobbyDeelnemers();
            }, 100);
            return;
        }

        // Tussenstand na Ronde 1 (index 8 is net na vraag 7, oftewel na 8 vragen)
        if (huidigeVraagIndex === 8) {
            if (timerInterval) clearInterval(timerInterval);

            let overzichtHtml = `
                <h1>🎄 Overzicht Ronde 1 🎄</h1>
                <p style="color:var(--text-muted); font-size: 15px;">Bespreek de antwoorden van Ronde 1:</p>
                <div class="overzicht-container">
            `;

            for (let i = 0; i < 8; i++) {
                let vraag = vragenData[i];
                let antwoordWeergave = vraag.juist;
                overzichtHtml += `
                    <div class="overzicht-item">
                        <div class="vraag-titel-overzicht">${vraag.titel.replace(/\n/g, ' ')}</div>
                        <div class="juist-antwoord-overzicht">✅ Juiste antwoord: ${antwoordWeergave}</div>
                    </div>
                `;
            }

            overzichtHtml += `
                </div>
                <button class="btn-geel" onclick="volgendeVraag()">START RONDE 8 ➔</button>
            `;

            hostContent.innerHTML = overzichtHtml;
            return;
        }

        // Overzicht na Ronde 8 (einde quiz)
        if (huidigeVraagIndex >= vragenData.length && !toonLeaderboardStap) {
            if (timerInterval) clearInterval(timerInterval);

            let overzichtHtml = `
                <h1>🎄 Overzicht Ronde 8 🎄</h1>
                <p style="color:var(--text-muted); font-size: 15px;">Bespreek de antwoorden van Ronde 8:</p>
                <div class="overzicht-container">
            `;

            for (let i = 8; i < vragenData.length; i++) {
                let vraag = vragenData[i];
                let antwoordWeergave = vraag.juist;
                if (vraag.optiesDetail) {
                    let letters = vraag.juist.replace(/[^a-z]/gi, '').toUpperCase().split('');
                    let volgordePijltjes = letters.join(" -> ");
                    let detailsLijst = letters.map(l => `${l}: ${vraag.optiesDetail[l]}`).join("<br>");
                    antwoordWeergave = `<strong>${volgordePijltjes}</strong><br><br>${detailsLijst}`;
                }

                overzichtHtml += `
                    <div class="overzicht-item">
                        <div class="vraag-titel-overzicht">${vraag.titel.replace(/\n/g, ' ')}</div>
                        <div class="juist-antwoord-overzicht">✅ Juiste antwoord:<br>${antwoordWeergave}</div>
                    </div>
                `;
            }

            overzichtHtml += `
                </div>
                <button class="btn-geel" onclick="toonEinduitslag()">BEKIJK EINDSTAND / LEADERBOARD 🏆</button>
            `;

            hostContent.innerHTML = overzichtHtml;
            return;
        }

        // Leaderboard aan het eind
        if (huidigeVraagIndex >= vragenData.length && toonLeaderboardStap) {
            let scores = actieveDeelnemers.map(naam => {
                let antwoordenVanSpeler = quizAntwoorden[naam] || {};
                let punten = 0;
                for (let vIdx = 0; vIdx < vragenData.length; vIdx++) {
                    if (isAntwoordJuistHost(vIdx, antwoordenVanSpeler[vIdx])) {
                        punten++;
                    }
                }
                return { naam, punten };
            });

            scores.sort((a, b) => b.punten - a.punten);

            let leaderboardHtml = `
                <h1 style="margin-top: 20px;">🏆 Einde Kerstquiz! 🏆</h1>
                <p style="color:var(--accent-gold); font-weight:800; font-size:16px;">Eindstand & Leaderboard</p>
                <table class="leaderboard-tabel">
                    <tr>
                        <th>Plaats</th>
                        <th>Naam</th>
                        <th>Score</th>
                    </tr>
            `;

            if (scores.length === 0) {
                leaderboardHtml += `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Geen deelnemers geregistreerd.</td></tr>`;
            } else {
                scores.forEach((s, idx) => {
                    let medaille = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
                    leaderboardHtml += `<tr>
                        <td><strong>${medaille}</strong></td>
                        <td>${s.naam}</td>
                        <td><strong>${s.punten} / ${vragenData.length} goed</strong></td>
                    </tr>`;
                });
            }
            leaderboardHtml += `</table>`;

            hostContent.innerHTML = leaderboardHtml;
            return;
        }

        const huidige = vragenData[huidigeVraagIndex];
        let afbeeldingHtml = huidige.afbeelding ? `<img src="${huidige.afbeelding}" class="vraag-afbeelding" alt="Visueel Voorbeeld">` : '';
        
        let optiesHtml = '';
        if (huidige.opties && huidige.opties.length > 0) {
            optiesHtml = `<div class="opties-container">` + 
                huidige.opties.map(optie => `<div class="optie-item">${optie}</div>`).join('') + 
                `</div>`;
        }

        hostContent.innerHTML = `
            <div class="vraag-header-row">
                <div class="progress-box"><div class="progress-bar" id="progress-bar-fill"></div></div>
                <div class="vraag-titel-badge">
                    <span class="hoofd">RONDE ${huidige.ronde} | VRAAG ${(huidige.ronde === 1 ? huidigeVraagIndex + 1 : huidigeVraagIndex - 7)} VAN ${(huidige.ronde === 1 ? 8 : 12)}</span>
                    <span class="sub">${huidige.categorie}</span>
                </div>
                <div class="timer-klok">⏱️ <span id="timer-display">45s</span></div>
            </div>

            ${afbeeldingHtml}
            <div class="vraag-box">${huidige.titel}</div>
            ${optiesHtml}

            <div style="margin-top: 10px; font-weight: 700; color: var(--text-muted); font-size: 13px;" id="ingediend-status">Ingezonden antwoorden: ${ingezondenCount} / ${actieveDeelnemers.length}</div>
            
            <button class="btn-geel" onclick="volgendeVraag()">VOLGENDE VRAAG ➔</button>
        `;

        startTimer();
    }

    renderHostScherm();
</script>
