    let huidigeVraagIndex = -1;
    let getoondOverzichtRonde = null;
    let toonLeaderboardStap = false;
    let actieveDeelnemers = [];
    let ingezondenCount = 0;
    let totaalDeelnemersCount = 0;
    let quizAntwoorden = {};
    let vraagIsActief = false;

    // Subfase voor Ronde 4 filmvragen: 'fragment' -> 'vraag' -> 'antwoord_fragment'
    let ronde4Subfase = null;

    let timerInterval = null;
    let overgeblevenTijd = 45;

    function isGeheugenVraag(idx) {
        return idx === 34 || idx === 35 || idx === 38 || idx === 39;
    }

    function speelFilm(srcPad) {
        const speler = document.getElementById("host-film-speler");
        if (!speler) return;
        if (srcPad) {
            speler.src = srcPad;
            speler.load();
        }
        speler.play().catch(() => {});
    }

    function zendRonde4Subfase(vraagIdx, subfase) {
        socket.emit('volgende-vraag', { index: vraagIdx, subfase: subfase });
    }

    function initialiseerSubfaseVoorVraag(idx, ontvangenSubfase) {
        if (idx >= 0 && idx < vragenData.length && vragenData[idx] && vragenData[idx].videoVraag) {
            ronde4Subfase = ontvangenSubfase || 'fragment';
            if (ronde4Subfase === 'vraag') {
                vraagIsActief = false;
                setTimeout(() => { vraagIsActief = true; }, 800);
            } else {
                vraagIsActief = false;
            }
        } else {
            ronde4Subfase = null;
            vraagIsActief = false;
            setTimeout(() => { vraagIsActief = true; }, 800);
        }
    }

    socket.on('update-status', (data) => {
        const rawIdx = data.huidigeVraagIndex;
        const idx = (rawIdx && typeof rawIdx === 'object') ? rawIdx.index : rawIdx;
        const subfase = (rawIdx && typeof rawIdx === 'object') ? rawIdx.subfase : null;
        huidigeVraagIndex = idx;
        toonLeaderboardStap = data.toonEindstand;
        actieveDeelnemers = data.actieveDeelnemers;
        initialiseerSubfaseVoorVraag(huidigeVraagIndex, subfase);
        renderHostScherm();
    });

    socket.on('zet-vraag', (payload) => {
        const idx = (payload && typeof payload === 'object') ? payload.index : payload;
        const subfase = (payload && typeof payload === 'object') ? payload.subfase : null;
        huidigeVraagIndex = idx;
        toonLeaderboardStap = false;
        initialiseerSubfaseVoorVraag(huidigeVraagIndex, subfase);
        renderHostScherm();
    });

    socket.on('update-deelnemers', (deelnemersLijst) => {
        actieveDeelnemers = deelnemersLijst;
        updateLobbyDeelnemers();
    });

    socket.on('update-ingezonden', (data) => {
        if (data.alleAntwoorden) {
            quizAntwoorden = data.alleAntwoorden;
        }

        if (data.vraagIndex === huidigeVraagIndex && !getoondOverzichtRonde) {
            ingezondenCount = data.aantal;
            totaalDeelnemersCount = data.totaal;
            
            const statusEl = document.getElementById("ingediend-status");
            if (statusEl) {
                statusEl.innerText = `Ingezonden antwoorden: ${ingezondenCount} / ${totaalDeelnemersCount}`;
            }

            if (vraagIsActief && totaalDeelnemersCount > 0 && ingezondenCount >= totaalDeelnemersCount) {
                if (timerInterval) clearInterval(timerInterval);
                const huidige = vragenData[huidigeVraagIndex];
                setTimeout(() => {
                    if (huidige && huidige.videoAntwoord && ronde4Subfase === 'vraag') {
                        ronde4Subfase = 'antwoord_fragment';
                        vraagIsActief = false;
                        zendRonde4Subfase(huidigeVraagIndex, 'antwoord_fragment');
                        renderHostScherm();
                    } else {
                        volgendeVraag();
                    }
                }, 1000);
            }
        }
    });

    socket.on('quiz-gereset', () => {
        huidigeVraagIndex = -1;
        getoondOverzichtRonde = null;
        toonLeaderboardStap = false;
        ronde4Subfase = null;
        actieveDeelnemers = [];
        quizAntwoorden = {};
        vraagIsActief = false;
        if (timerInterval) clearInterval(timerInterval);

    function vergelijkMetSpelfout(gegeven, juist) {
        let a = String(gegeven || "").trim().toLowerCase();
        let b = String(juist || "").trim().toLowerCase();
        
        a = a.replace(/^[.]+|[.]+$/g, "").trim();
        b = b.replace(/^[.]+|[.]+$/g, "").trim();

        if (a === b) return true;

        let levenshtein = (str1, str2) => {
            let track = Array(str2.length + 1).fill(null).map(() =>
                Array(str1.length + 1).fill(null));
            for (let i = 0; i <= str1.length; i += 1) { track[0][i] = i; }
            for (let j = 0; j <= str2.length; j += 1) { track[j][0] = j; }
            for (let j = 1; j <= str2.length; j += 1) {
                for (let i = 1; i <= str1.length; i += 1) {
                    let indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1,
                        track[j - 1][i] + 1,
                        track[j - 1][i - 1] + indicator
                    );
                }
            }
            return track[str2.length][str1.length];
        };

        return levenshtein(a, b) <= 2;
    }

    function controleerGroepen(antw, verwachteGroepen) {
        if (!antw) return false;
        let groepen = String(antw).toLowerCase().split('|').map(g =>
            g.split(',').map(w => w.trim()).filter(Boolean).sort().join(',')
        ).filter(Boolean).sort();
        let verwacht = verwachteGroepen.map(g =>
            g.map(w => w.toLowerCase().trim()).sort().join(',')
        ).sort();
        return groepen.length === 3 && groepen.every((val, idx) => val === verwacht[idx]);
    }

    function controleerEmoticonSelectie(antw, verwachteEmoticons) {
        if (!antw) return false;
        let gekozen = String(antw).split(',').map(e => e.trim()).filter(Boolean);
        if (gekozen.length !== verwachteEmoticons.length) return false;
        return verwachteEmoticons.every(e => gekozen.includes(e));
    }

    function isAntwoordJuistHost(index, antw) {
        if (!antw) return false;
        let a = String(antw).trim().toLowerCase();

        switch(index) {
            case 0: return a.startsWith("b") || a.includes("duitsland");
            case 1: return a.startsWith("c") || a === "4";
            case 2: return a.startsWith("a") || a.includes("mexico");
            case 3: return vergelijkMetSpelfout(a, "Sinterklaas");
            case 4: return a === "6" || a.includes("zes");
            case 5: return vergelijkMetSpelfout(a, "Drenthe");
            case 6: return a.includes("waar") && !a.includes("niet");
            case 7: return a.includes("niet waar");

            // Ronde 4 (Index 8 t/m 15)
            case 8: return a.startsWith("c") || a.includes("dansen");
            case 9: return a.startsWith("c") || a.includes("veren");
            case 10: return a.replace(/[^a-z]/gi, '').toLowerCase() === "badc";
            case 11: return a.replace(/[^a-z]/gi, '').toLowerCase() === "abcd";
            case 12: return a.startsWith("c") || a.includes("santa clause");
            case 13: return a.startsWith("a") || a.includes("red one");
            case 14: return a.startsWith("d") || a.includes("grinch");
            case 15: return a.startsWith("b") || a.includes("jingle jangle");

            // Ronde 5 (Index 16 t/m 23)
            case 16: return vergelijkMetSpelfout(a, "Stille Nacht");
            case 17: return vergelijkMetSpelfout(a, "The Polar Express") || vergelijkMetSpelfout(a, "Polar Express") || vergelijkMetSpelfout(a, "De Polar Express");
            case 18: return a.startsWith("o") || a.includes("kaars");
            case 19: return a.startsWith("a") || a.includes("slinger");
            case 20: return vergelijkMetSpelfout(a, "kerstballen") || vergelijkMetSpelfout(a, "kerstbal");
            case 21: return vergelijkMetSpelfout(a, "rendieren") || vergelijkMetSpelfout(a, "rendier");
            case 22: return controleerGroepen(a, [
                ["blitzen", "vixen", "dasher"],
                ["stal", "herberg", "ster"],
                ["jingle bells", "stille nacht", "last christmas"]
            ]);
            case 23: return controleerGroepen(a, [
                ["home alone", "elf", "the polar express"],
                ["grinch", "scrooge", "jack frost"],
                ["goud", "wierook", "mirre"]
            ]);

            // Ronde 6 (Index 24 t/m 31)
            case 24: return a.startsWith("b") || a.includes("neurenberg");
            case 25: return a.startsWith("c") || a.includes("new york");
            case 26: return a.startsWith("a") || a.includes("japan");
            case 27: return a.startsWith("d") || a.includes("ijsland");
            case 28: return a.startsWith("b") || a.includes("italië") || a.includes("italie");
            case 29: return a.startsWith("b") || a.includes("duitsland");
            case 30: return a.startsWith("b") || a.includes("rusland");
            case 31: return a.startsWith("c") || a.includes("australië") || a.includes("australie");

            // Ronde 7 (Index 32 t/m 39)
            case 32: return vergelijkMetSpelfout(a, "kerst");
            case 33: return vergelijkMetSpelfout(a, "sneeuw");
            case 34: return a === "stokbrood, roomboter, champignons, champagne, gourmetvlees, aardappelen, glühwein, brie";
            case 35: return a === "kerststol, rollade, zalm, bladerdeeg, wijn, satésaus, krieltjes, komkommer";
            case 36: return a.replace(/\s+/g, '') === "mistletoe";
            case 37: return a.replace(/\s+/g, '') === "arrenslee";
            case 38: return controleerEmoticonSelectie(antw, ["🌟", "🍷", "🛷", "🎶"]);
            case 39: return controleerEmoticonSelectie(antw, ["🥂", "🧣", "👼", "🎺"]);

            // Ronde 8 (Index 40 t/m 51)
            case 40:
                let num1 = parseFloat(a.replace(/[^0-9.]/g, ''));
                if (num1 < 100) num1 = num1 * 1000000;
                return !isNaN(num1) && num1 >= 2250000 && num1 <= 2750000;
            case 41:
                let num2 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num2) && num2 >= 300 && num2 <= 350;
            case 42: return a.replace(/[^a-z]/gi, '').toLowerCase() === "bdca";
            case 43: return a.replace(/[^a-z]/gi, '').toLowerCase() === "dbac";
            case 44: return a.includes("waar") && !a.includes("niet");
            case 45: return a.includes("niet waar");
            case 46:
                let num6 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num6) && num6 >= 80 && num6 <= 90;
            case 47:
                let num7 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num7) && num7 >= 20 && num7 <= 30;
            case 48: return a.startsWith("c") || a.includes("drenthe");
            case 49: return a.startsWith("c") || a.includes("23");
            case 50: return a.startsWith("a") || a.includes("44,7");
            case 51: return a.startsWith("c") || a.includes("30–40");
            default: return false;
        }
    }

                leaderboardHtml += `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Geen deelnemers geregistreerd.</td></tr>`;
            } else {
                scores.forEach((s, idx) => {
                    let medaille = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
                    leaderboardHtml += `<tr>
                        <td><strong>${medaille}</strong></td>
                        <td>${s.naam}</td>
                        <td><strong>${s.punten} / ${vragenData.length} goed</strong></td>
                    </tr>`;
                });
            }
            leaderboardHtml += `</table>`;

            hostContent.innerHTML = leaderboardHtml;
            return;
        }

        const huidige = vragenData[huidigeVraagIndex];
        let vraagNr = huidige.ronde === 1 ? huidigeVraagIndex + 1 :
                      (huidige.ronde === 4 ? huidigeVraagIndex - 7 :
                      (huidige.ronde === 5 ? huidigeVraagIndex - 15 :
                      (huidige.ronde === 6 ? huidigeVraagIndex - 23 :
                      (huidige.ronde === 7 ? huidigeVraagIndex - 31 : huidigeVraagIndex - 39))));
        let totaalNr = huidige.ronde === 8 ? 12 : 8;

        // Zorg dat een video-vraag altijd bij 'fragment' start als ronde4Subfase nog niet is gezet
        if (huidige.videoVraag && ronde4Subfase === null) {
            ronde4Subfase = 'fragment';
            zendRonde4Subfase(huidigeVraagIndex, 'fragment');
        }

        // Stap 1 bij Ronde 4 video-vragen: eerst fragment/scène tonen zonder vraag en zonder antwoordtimer
        if (huidige.videoVraag && ronde4Subfase === 'fragment') {
            if (timerInterval) clearInterval(timerInterval);
            hostContent.innerHTML = `
                <div class="vraag-header-row">
                    <div class="progress-box"><div class="progress-bar" style="width: 0%;"></div></div>
                    <div class="vraag-titel-badge">
                        <span class="hoofd">RONDE ${huidige.ronde} | VRAAG ${vraagNr} VAN ${totaalNr}</span>
                        <span class="sub">${huidige.categorie} • Fragment</span>
                    </div>
                    <div class="timer-klok">🎬 <span id="timer-display">Film</span></div>
                </div>

                <div class="film-box">
                    <div class="film-context">🔊 ${huidige.context}</div>
                    <video id="host-film-speler" class="film-video" src="${huidige.videoVraag}" controls preload="metadata"></video>
                    <div class="film-knoppen">
                        <button type="button" class="btn-film" onclick="speelFilm('${huidige.videoVraag}')">▶️ Start fragment</button>
                    </div>
                </div>

                <button class="btn-geel" onclick="volgendeVraag()">NAAR VRAAG ➔</button>
            `;
            return;
        }

        // Stap 3 bij Ronde 4 vragen 1 & 2: na beantwoorden het hele antwoordfragment tonen
        if (huidige.videoAntwoord && ronde4Subfase === 'antwoord_fragment') {
            if (timerInterval) clearInterval(timerInterval);
            hostContent.innerHTML = `
                <div class="vraag-header-row">
                    <div class="progress-box"><div class="progress-bar" style="width: 100%;"></div></div>
                    <div class="vraag-titel-badge">
                        <span class="hoofd">RONDE ${huidige.ronde} | VRAAG ${vraagNr} VAN ${totaalNr}</span>
                        <span class="sub">${huidige.categorie} • Hele fragment</span>
                    </div>
                    <div class="timer-klok">🎬 <span id="timer-display">Antwoord</span></div>
                </div>

                <div class="film-box">
                    <div class="film-context">🎬 Hele fragment</div>
                    <video id="host-film-speler" class="film-video" src="${huidige.videoAntwoord}" controls preload="metadata"></video>
                    <div class="film-knoppen">
                        <button type="button" class="btn-film" onclick="speelFilm('${huidige.videoAntwoord}')">▶️ Start hele fragment</button>
                    </div>
                </div>

                <button class="btn-geel" onclick="volgendeVraag()">VOLGENDE VRAAG ➔</button>
            `;
            return;
        }
        
        let mediaHtml = '';
        if (huidige.emoticons) {
            mediaHtml = `<div class="emoticon-display">${huidige.emoticons}</div>`;
        } else if (huidige.afbeelding) {
            const imgClass = huidige.isGrotePng ? "ronde4-png-afbeelding" : "vraag-afbeelding";
            mediaHtml = `<img src="${huidige.afbeelding}" class="${imgClass}" alt="Visueel Voorbeeld">`;
        }
        
        let optiesHtml = '';
        if (huidige.boodschappenLijst) {
            optiesHtml = `<div id="host-geheugen-gebied"><div class="boodschappen-grid">` +
                huidige.boodschappenLijst.map((item, idx) => `<div class="boodschap-kaart"><span>${idx + 1}.</span> ${item}</div>`).join('') +
                `</div></div>`;
        } else if (huidige.emoticons12) {
            optiesHtml = `<div id="host-geheugen-gebied"><div class="emoticon-grid-host">` +
                huidige.emoticons12.map(em => `<div>${em}</div>`).join('') +
                `</div></div>`;
        } else if (huidige.letters) {
            optiesHtml = `<div class="letter-tegels-host">` +
                huidige.letters.map(l => `<div class="letter-tegel-host">${l}</div>`).join('') +
                `</div>`;
        } else if (huidige.opties && huidige.opties.length > 0) {
            optiesHtml = `<div class="opties-container">` + 
                huidige.opties.map(optie => `<div class="optie-item">${optie}</div>`).join('') + 
                `</div>`;
        }

        let beginTijd = isGeheugenVraag(huidigeVraagIndex) ? 80 : 45;

        hostContent.innerHTML = `
            <div class="vraag-header-row">
                <div class="progress-box"><div class="progress-bar" id="progress-bar-fill"></div></div>
                <div class="vraag-titel-badge">
                    <span class="hoofd">RONDE ${huidige.ronde} | VRAAG ${vraagNr} VAN ${totaalNr}</span>
                    <span class="sub">${huidige.categorie}</span>
                </div>
                <div class="timer-klok">⏱️ <span id="timer-display">${beginTijd}s</span></div>
            </div>

            ${mediaHtml}
            <div class="vraag-box" id="host-vraag-tekst">${huidige.titel}</div>
            ${optiesHtml}

            <div style="margin-top: 10px; font-weight: 700; color: var(--text-muted); font-size: 13px;" id="ingediend-status">Ingezonden antwoorden: ${ingezondenCount} / ${actieveDeelnemers.length}</div>
            
            <button class="btn-geel" onclick="volgendeVraag()">VOLGENDE VRAAG ➔</button>
        `;

        startTimer();
    }

    renderHostScherm();
</script>

</body>
</html>
