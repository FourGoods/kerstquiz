        flake.style.animationDelay = (Math.random() * 5) + 's';

        { type: "tekst", juist: "peperkoekman of peperkoekmannetje of peperkoek man of peperkoek mannetje", ronde: 3, heeftAntwoordFoto: true },
        { type: "tekst", juist: "Emma Watson", ronde: 3 },
        { type: "tekst", juist: "John Legend", ronde: 3 },
        { type: "keuze", juist: "D) Rum", ronde: 3 },
        { type: "keuze", juist: "A) Marsepein", ronde: 3 },
        { type: "getal", juist: "114", ronde: 3 },
        { type: "getal", juist: "103", ronde: 3 },

        // Ronde 4 (index 16 t/m 23)
        { type: "keuze", juist: "C) Scrooge begint samen met Mrs. Dilber te dansen.", ronde: 4, heeftVideo: true },
        { type: "keuze", juist: "C) Marv krijgt een lading veren in zijn gezicht.", ronde: 4, heeftVideo: true },
        { type: "volgorde", juist: "B -> A -> D -> C", ronde: 4 },
        { type: "volgorde", juist: "A -> B -> C -> D", ronde: 4 },
        { type: "keuze", juist: "C) The Santa Clause", ronde: 4, heeftVideo: true },
        { type: "keuze", juist: "A) Red One", ronde: 4, heeftVideo: true },
        { type: "keuze", juist: "D) How the Grinch Stole Christmas", ronde: 4 },
        { type: "keuze", juist: "B) Jingle Jangle: A Christmas Journey", ronde: 4 },

        // Ronde 5 (index 24 t/m 31)
        { type: "tekst", juist: "Stille Nacht", ronde: 5 },
        { type: "tekst", juist: "The Polar Express", ronde: 5 },
        { type: "keuze", juist: "O) Met de overige letters kan het woord 'kaars' gevormd worden.", ronde: 5 },
        { type: "keuze", juist: "A) Met de overige letters kan het woord 'slinger' gevormd worden.", ronde: 5 },
        { type: "tekst", juist: "kerstballen", ronde: 5 },

        { type: "groepen", juist: "Rendieren: Blitzen, Vixen, Dasher | Kerstverhaal: Stal, Herberg, Ster | Kerstliedjes: Jingle Bells, Stille Nacht, Last Christmas", ronde: 5 },
        { type: "groepen", juist: "Kerstfilms: Home Alone, Elf, The Polar Express | Mopperkonten: Grinch, Scrooge, Jack Frost | Wijzen: Goud, Wierook, Mirre", ronde: 5 },

        // Ronde 6 (index 32 t/m 39)

        { type: "keuze", juist: "C) New York City, Verenigde Staten (De Rockefeller Center Christmas Tree)", ronde: 6 },

        { type: "keuze", juist: "B) Italië", ronde: 6 },
        { type: "keuze", juist: "B) Duitsland", ronde: 6 },

        // Ronde 7 (index 40 t/m 47)
        { type: "tekst", juist: "Kerst", ronde: 7 },
        { type: "tekst", juist: "Sneeuw", ronde: 7 },
        { type: "boodschappen", juist: "1. Stokbrood, 2. Roomboter, 3. Champignons, 4. Champagne, 5. Gourmetvlees, 6. Aardappelen, 7. Glühwein, 8. Brie", ronde: 7 },
        { type: "boodschappen", juist: "1. Kerststol, 2. Rollade, 3. Zalm, 4. Bladerdeeg, 5. Wijn, 6. Satésaus, 7. Krieltjes, 8. Komkommer", ronde: 7 },
        { type: "anagram", juist: "Mistletoe", ronde: 7 },
        { type: "anagram", juist: "Arrenslee", ronde: 7 },
        { type: "emoticons_geheugen", juist: "🌟 🍷 🛷 🎶", ronde: 7 },
        { type: "emoticons_geheugen", juist: "🥂 🧣 👼 🎺", ronde: 7 },

        // Ronde 8 (index 48 t/m 59)
        { type: "getal", juist: "2.500.000", ronde: 8 },
        { type: "getal", juist: "€325", ronde: 8 },
        { type: "volgorde", juist: "B -> D -> C -> A", ronde: 8 },
        { type: "volgorde", juist: "D -> B -> A -> C", ronde: 8 },
        { type: "keuze", juist: "Waar", ronde: 8 },
        { type: "keuze", juist: "Niet waar", ronde: 8 },
        { type: "getal", juist: "85%", ronde: 8 },
        { type: "getal", juist: "25%", ronde: 8 },
        { type: "keuze", juist: "C) Drenthe", ronde: 8 },
        { type: "keuze", juist: "C) 23 december", ronde: 8 },
        { type: "keuze", juist: "A) 44,7 meter", ronde: 8 },
        { type: "keuze", juist: "C) 30–40 dagen", ronde: 8 }
    ];

    let geselecteerdeVolgorde = [];
    let geselecteerdeGroepen = [];
    let geselecteerdeEmoticons = [];
    let spelTimerInterval = null;
    let isVerstuurd = false;
    let huidigeVraagIndex = -1;
    let toonEindstandStatus = false;
    let mijnNaam = "";
    let serverAntwoorden = {};
    let ronde4SubfaseDeelnemer = null;
    let ronde3AntwoordFotoDeelnemer = false;

    function verwerkVraagPayload(payload) {
        const idx = (payload && typeof payload === 'object') ? payload.index : payload;
        const subfase = (payload && typeof payload === 'object') ? payload.subfase : null;
        huidigeVraagIndex = idx;
        ronde3AntwoordFotoDeelnemer = (subfase === 'antwoord_foto');
        ronde4SubfaseDeelnemer = (idx >= 0 && vragenData[idx] && vragenData[idx].heeftVideo)
            ? (subfase || 'fragment')
            : null;
    }

    socket.on('update-status', (data) => {
        verwerkVraagPayload(data.huidigeVraagIndex);
        toonEindstandStatus = data.toonEindstand;
        if (data.alleAntwoorden) {
            serverAntwoorden = data.alleAntwoorden;
        }
        toonDeelnemerVraag(huidigeVraagIndex);
    });

    socket.on('zet-vraag', (payload) => {
        verwerkVraagPayload(payload);
        toonEindstandStatus = false;
        toonDeelnemerVraag(huidigeVraagIndex);
    });

    socket.on('update-ingezonden', (data) => {
        if (data.alleAntwoorden) {
            serverAntwoorden = data.alleAntwoorden;
        }
    });

    socket.on('quiz-gereset', () => {
        if (spelTimerInterval) clearInterval(spelTimerInterval);
        huidigeVraagIndex = -1;
        toonEindstandStatus = false;
        ronde4SubfaseDeelnemer = null;
        ronde3AntwoordFotoDeelnemer = false;
        mijnNaam = "";
        serverAntwoorden = {};
        localStorage.removeItem("huidigeDeelnemerNaam");
        toonDeelnemerVraag(-1);
    });

    function registreerDeelnemer() {
        const inputVal = document.getElementById("deelnemer-naam").value.trim();
        if (!inputVal) {
            alert("Vul alstublieft je naam in!");
            return;
        }
        mijnNaam = inputVal;
        localStorage.setItem("huidigeDeelnemerNaam", mijnNaam);
        socket.emit('registreer-deelnemer', mijnNaam);
        toonDeelnemerVraag(huidigeVraagIndex);
    }

    function wisNaam() {
        mijnNaam = "";
        localStorage.removeItem("huidigeDeelnemerNaam");
        toonDeelnemerVraag(-1);
    }

    function slaAntwoordOp(vraagIndex, antwoordTekst) {
        socket.emit('sla-antwoord op', {
            naam: mijnNaam,
            vraagIndex: vraagIndex,
            antwoord: antwoordTekst
        });
    }

    function vergelijkMetSpelfout(gegeven, juist) {
        let a = String(gegeven || "").trim().toLowerCase();
        let b = String(juist || "").trim().toLowerCase();
        
        a = a.replace(/^[.]+|[.]+$/g, "").trim();
        b = b.replace(/^[.]+|[.]+$/g, "").trim();

        if (a === b) return true;

        let levenshtein = (str1, str2) => {
            let track = Array(str2.length + 1).fill(null).map(() =>
                Array(str1.length + 1).fill(null));
            for (let i = 0; i <= str1.length; i += 1) { track[0][i] = i; }
            for (let j = 0; j <= str2.length; j += 1) { track[j][0] = j; }
            for (let j = 1; j <= str2.length; j += 1) {
                for (let i = 1; i <= str1.length; i += 1) {
                    let indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1,
                        track[j - 1][i] + 1,
                        track[j - 1][i - 1] + indicator
                    );
                }
            }
            return track[str2.length][str1.length];
        };

        return levenshtein(a, b) <= 2;
    }

    function controleerGroepen(antw, verwachteGroepen) {
        if (!antw) return false;
        let groepen = String(antw).toLowerCase().split('|').map(g =>
            g.split(',').map(w => w.trim()).filter(Boolean).sort().join(',')
        ).filter(Boolean).sort();
        let verwacht = verwachteGroepen.map(g =>
            g.map(w => w.toLowerCase().trim()).sort().join(',')
        ).sort();
        return groepen.length === 3 && groepen.every((val, idx) => val === verwacht[idx]);
    }

    function controleerEmoticonSelectie(antw, verwachteEmoticons) {
        if (!antw) return false;
        let gekozen = String(antw).split(',').map(e => e.trim()).filter(Boolean);
        if (gekozen.length !== verwachteEmoticons.length) return false;
        return verwachteEmoticons.every(e => gekozen.includes(e));
    }

    function isAntwoordJuistDeelnemer(index, antw) {
        if (!antw) return false;
        let a = String(antw).trim().toLowerCase();

        switch(index) {
            case 0: return a.startsWith("b") || a.includes("duitsland");
            case 1: return a.startsWith("c") || a === "4";
            case 2: return a.startsWith("a") || a.includes("mexico");
            case 3: return vergelijkMetSpelfout(a, "Sinterklaas");
            case 4: return a === "6" || a.includes("zes");
            case 5: return vergelijkMetSpelfout(a, "Drenthe");
            case 6: return a.includes("waar") && !a.includes("niet");
            case 7: return a.includes("niet waar");

            // Ronde 3 (Index 8 t/m 15)
            case 8: return vergelijkMetSpelfout(a, "piek") || vergelijkMetSpelfout(a, "kerstpiek") || a.includes("piek");
            case 9: return ["peperkoekman", "peperkoekmannetje", "peperkoek man", "peperkoek mannetje"].some(opt => vergelijkMetSpelfout(a, opt));
            case 10: return vergelijkMetSpelfout(a, "Emma Watson");
            case 11: return vergelijkMetSpelfout(a, "John Legend");
            case 12: return a.startsWith("d") || a.includes("rum");
            case 13: return a.startsWith("a") || a.includes("marsepein");
            case 14: {
                let n7 = parseFloat(a.replace(/[^0-9.-]/g, ''));
                return !isNaN(n7) && n7 >= (114 - 15) && n7 <= (114 + 15);
            }
            case 15: {
                let n8 = parseFloat(a.replace(/[^0-9.-]/g, ''));
                return !isNaN(n8) && n8 >= (103 - 15) && n8 <= (103 + 15);
            }

            // Ronde 4 (Index 16 t/m 23)
            case 16: return a.startsWith("c") || a.includes("dansen");
            case 17: return a.startsWith("c") || a.includes("veren");
            case 18: return a.replace(/[^a-z]/gi, '').toLowerCase() === "badc";
            case 19: return a.replace(/[^a-z]/gi, '').toLowerCase() === "abcd";
            case 20: return a.startsWith("c") || a.includes("santa clause");
            case 21: return a.startsWith("a") || a.includes("red one");
            case 22: return a.startsWith("d") || a.includes("grinch");
            case 23: return a.startsWith("b") || a.includes("jingle jangle");

            // Ronde 5 (Index 24 t/m 31)
            case 24: return vergelijkMetSpelfout(a, "Stille Nacht");
            case 25: return vergelijkMetSpelfout(a, "The Polar Express") || vergelijkMetSpelfout(a, "Polar Express") || vergelijkMetSpelfout(a, "De Polar Express");

            case 28: return vergelijkMetSpelfout(a, "kerstballen") || vergelijkMetSpelfout(a, "kerstbal");
            case 29: return vergelijkMetSpelfout(a, "rendieren") || vergelijkMetSpelfout(a, "rendier");
            case 30: return controleerGroepen(a, [
                ["blitzen", "vixen", "dasher"],
                ["stal", "herberg", "ster"],
                ["jingle bells", "stille nacht", "last christmas"]
            ]);
            case 31: return controleerGroepen(a, [
                ["home alone", "elf", "the polar express"],
                ["grinch", "scrooge", "jack frost"],
                ["goud", "wierook", "mirre"]
            ]);

            // Ronde 6 (Index 32 t/m 39)
            case 32: return a.startsWith("b") || a.includes("neurenberg");
            case 33: return a.startsWith("c") || a.includes("new york");
            case 34: return a.startsWith("a") || a.includes("japan");
            case 35: return a.startsWith("d") || a.includes("ijsland");
            case 36: return a.startsWith("b") || a.includes("italië") || a.includes("italie");
            case 37: return a.startsWith("b") || a.includes("duitsland");
            case 38: return a.startsWith("b") || a.includes("rusland");
            case 39: return a.startsWith("c") || a.includes("australië") || a.includes("australie");

            // Ronde 7 (Index 40 t/m 47)
            case 40: return vergelijkMetSpelfout(a, "kerst");
            case 41: return vergelijkMetSpelfout(a, "sneeuw");
            case 42: return a === "stokbrood, roomboter, champignons, champagne, gourmetvlees, aardappelen, glühwein, brie";
            case 43: return a === "kerststol, rollade, zalm, bladerdeeg, wijn, satésaus, krieltjes, komkommer";
            case 44: return a.replace(/\s+/g, '') === "mistletoe";
            case 45: return a.replace(/\s+/g, '') === "arrenslee";
            case 46: return controleerEmoticonSelectie(antw, ["🌟", "🍷", "🛷", "🎶"]);
            case 47: return controleerEmoticonSelectie(antw, ["🥂", "🧣", "👼", "🎺"]);

            // Ronde 8 (Index 48 t/m 59)
            case 48:
                let num1 = parseFloat(a.replace(/[^0-9.]/g, ''));
                if (num1 < 100) num1 = num1 * 1000000;
                return !isNaN(num1) && num1 >= 2250000 && num1 <= 2750000;
            case 49:
                let num2 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num2) && num2 >= 300 && num2 <= 350;
            case 50: return a.replace(/[^a-z]/gi, '').toLowerCase() === "bdca";
            case 51: return a.replace(/[^a-z]/gi, '').toLowerCase() === "dbac";
            case 52: return a.includes("waar") && !a.includes("niet");
            case 53: return a.includes("niet waar");
            case 54:

            case 55:

                return !isNaN(num7) && num7 >= 20 && num7 <= 30;
            case 56: return a.startsWith("c") || a.includes("drenthe");
            case 57: return a.startsWith("c") || a.includes("23");
            case 58: return a.startsWith("a") || a.includes("44,7");
            case 59: return a.startsWith("c") || a.includes("30–40");
            default: return false;
        }
    }

                0: ["A) Engeland", "B) Duitsland", "C) Zweden", "D) Nederland"],
                1: ["A) 2", "B) 3", "C) 4", "D) 5"],
                2: ["A) Mexico", "B) Zuid-Afrika", "C) India", "D) Spanje"],
                6: ["Waar", "Niet waar"],
                7: ["Waar", "Niet waar"],
                12: ["A) Kaneel", "B) Rode wijn", "C) Kruidnagel", "D) Rum"],
                13: ["A) Marsepein", "B) Amandelspijs", "C) Sukade", "D) Roomboter"],
                16: [
                    "A) Scrooge begint samen met Mrs. Dilber te zingen.",
                    "B) Scrooge begint boos tegen Mrs. Dilber te schreeuwen.",
                    "C) Scrooge begint samen met Mrs. Dilber te dansen.",
                    "D) Scrooge loopt boos weg."
                ],
                17: [
                    "A) Marv krijgt een zware zak over zijn hoofd.",
                    "B) Marv wordt geraakt door een vallende verfemmer.",
                    "C) Marv krijgt een lading veren in zijn gezicht.",
                    "D) Marv krijgt een emmer lijm over zich heen."
                ],
                20: ["A) A Christmas Story", "B) Home Alone 2", "C) The Santa Clause", "D) Christmas with the Kranks"],
                21: ["A) Red One", "B) Falling for Christmas", "C) Candy Cane Lane", "D) Hot Frosty"],
                22: ["A) The Nightmare Before Christmas", "B) Arthur Christmas", "C) The Santa Clause", "D) How the Grinch Stole Christmas"],
                23: ["A) The Christmas Chronicles", "B) Jingle Jangle: A Christmas Journey", "C) The Nutcracker and the Four Realms", "D) A Boy Called Christmas"],
                26: ["S", "A", "O", "K", "R", "A"],
                27: ["G", "A", "L", "I", "N", "E", "R", "S"],
                32: ["A) Wenen, Oostenrijk", "B) Neurenberg, Duitsland", "C) Praag, Tsjechië", "D) Straatsburg, Frankrijk"],
                33: ["A) Grote Markt, Antwerpen", "B) Trafalgar Square, Londen", "C) New York City, Verenigde Staten", "D) Federation Square, Melbourne"],
                34: ["A) Japan", "B) China", "C) Zuid-Korea", "D) Singapore"],
                35: ["A) Noorwegen", "B) Nieuw-Zeeland", "C) Groenland", "D) Ijsland"],
                36: ["A) Zwitserland", "B) Italië", "C) Frankrijk", "D) Spanje"],
                37: ["A) Oostenrijk", "B) Duitsland", "C) Zwitserland", "D) België"],
                38: ["A) Griekenland", "B) Rusland", "C) Italië", "D) Portugal"],
                39: ["A) Canada", "B) Mexico", "C) Australië", "D) Japan"],
                52: ["Waar", "Niet waar"],
                53: ["Waar", "Niet waar"],
                56: ["A) Zuid-Holland", "B) Friesland", "C) Drenthe", "D) Noord-Holland"],
                57: ["A) 21 december", "B) 22 december", "C) 23 december", "D) 24 december"],
                58: ["A) 44,7 meter", "B) 64,6 meter", "C) 53,4 meter", "D) 71,2 meter"],
                59: ["A) 10–20 dagen", "B) 20–30 dagen", "C) 30–40 dagen", "D) 40–50 dagen"]
            };

            let opties = optiesMap[index] || [];
            opties.forEach((optie, optieIdx) => {
                const knop = document.createElement("button");
                knop.innerText = optie;
                knop.className = `btn btn-optie-${optieIdx % 4}`;
                knop.onclick = () => {
                    slaAntwoordoptieOp(index, optie);
                    feedbackEl.innerText = `Gekozen: ${optie}. Opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    const alleKnoppen = gebiedEl.getElementsByTagName("button");
                    for (let k of alleKnoppen) k.disabled = true;
                };
                gebiedEl.appendChild(knop);
            });
            
            function slaAntwoordoptieOp(idx, val) {
                slaAntwoordOp(idx, val);
            }
        }
        else if (huidige.type === "volgorde") {
            const isRonde4Volgorde = index === 18 || index === 19;
            const volgordeOpties = index === 18 ? [
                "A) The Nightmare Before Christmas",
                "B) Home Alone",
                "C) Love Actually",
                "D) Jingle All the Way"
            ] : index === 19 ? [
                "A) Arthur Christmas",
                "B) Last Christmas",
                "C) 8-Bit Christmas",
                "D) Family Switch"
            ] : index === 50 ? [
                "A) Rudolph het roodneuzige rendier...",
                "B) In een gedicht verschijnen rendieren...",
                "C) Coca-Cola lanceert reclamecampagne...",
                "D) Louis Prang massaproductie kerstkaarten."
            ] : [
                "A) Edward Johnson elektrische lampjes",
                "B) De eerste commerciële kerstkaart Sir Henry Cole",
                "C) De eerste kunstkerstbomen",
                "D) Adventskrans Johann Wichern"
            ];

            const updateVolgordeUI = () => {
                gebiedEl.innerHTML = "";
                volgordeOpties.forEach((optie, optieIndex) => {
                    const div = document.createElement("div");
                    div.className = isRonde4Volgorde ? `btn btn-optie-${optieIndex % 4}` : "volgorde-item";
                    if (isVerstuurd) div.classList.add("disabled");
                    
                    let positie = geselecteerdeVolgorde.indexOf(optieIndex);
                    if (positie !== -1) {
                        div.classList.add("selected");
                        if (isRonde4Volgorde) {
                            div.style.outline = "3px solid #fef3c7";
                            div.innerText = `${optie} (${positie + 1}.)`;
                        } else {
                            div.innerText = `${optie} (Stap ${positie + 1})`;
                        }
                    } else {
                        if (isRonde4Volgorde) div.style.outline = "none";
                        div.innerText = optie;
                    }

                    div.onclick = () => {
                        if (isVerstuurd) return;
                        let alGekozenIndex = geselecteerdeVolgorde.indexOf(optieIndex);
                        if (alGekozenIndex !== -1) {
                            geselecteerdeVolgorde.splice(alGekozenIndex, 1);
                        } else {
                            geselecteerdeVolgorde.push(optieIndex);
                        }
                        updateVolgordeUI();
                    };
                    gebiedEl.appendChild(div);
                });

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur Antwoord 🎯";
                if (isVerstuurd) verstuurKnop.disabled = true;

                verstuurKnop.onclick = () => {
                    if (geselecteerdeVolgorde.length < volgordeOpties.length) {
                        alert(`Selecteer alle ${volgordeOpties.length} opties in de gewenste volgorde voordat je verstuurt!`);
                        return;
                    }
                    isVerstuurd = true;
                    const volgordeTekst = geselecteerdeVolgorde.map(i => String.fromCharCode(65 + i)).join(" -> ");
                    slaAntwoordOp(index, volgordeTekst);
                    feedbackEl.innerText = `Volgorde (${volgordeTekst}) opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    updateVolgordeUI();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            updateVolgordeUI();
        }
        else if (huidige.type === "groepen") {
            let woorden = index === 30 ? [
                "BLITZEN", "STILLE NACHT", "HERBERG",
                "VIXEN", "STAL", "LAST CHRISTMAS",
                "DASHER", "JINGLE BELLS", "STER"
            ] : [
                "HOME ALONE", "GOUD", "ELF",
                "GRINCH", "WIEROOK", "SCROOGE",
                "THE POLAR EXPRESS", "JACK FROST", "MIRRE"
            ];

            const updateGroepenUI = () => {
                gebiedEl.innerHTML = `<p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">Tik telkens 3 woorden aan die bij elkaar horen:</p>`;
                const grid = document.createElement("div");
                grid.className = "groepen-grid";

                woorden.forEach((woord, origIndex) => {
                    const btn = document.createElement("button");
                    btn.className = "groep-woord-btn";
                    btn.innerText = woord;

                    let pos = geselecteerdeGroepen.indexOf(origIndex);
                    if (pos !== -1) {
                        let groepNr = Math.floor(pos / 3);
                        btn.classList.add(`groep-${groepNr}`);
                        btn.innerText = `${woord}\n(Groep ${groepNr + 1})`;
                    }

                    btn.onclick = () => {
                        if (isVerstuurd) return;
                        let alPos = geselecteerdeGroepen.indexOf(origIndex);
                        if (alPos !== -1) {
                            geselecteerdeGroepen.splice(alPos, 1);
                        } else {
                            geselecteerdeGroepen.push(origIndex);
                        }
                        updateGroepenUI();
                    };
                    grid.appendChild(btn);
                });

                gebiedEl.appendChild(grid);

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur Antwoord 🎯";
                if (isVerstuurd) verstuurKnop.disabled = true;

                verstuurKnop.onclick = () => {
                    if (geselecteerdeGroepen.length < 9) {
                        alert("Verdeel alle 9 woorden in 3 groepjes van 3 voordat je verstuurt!");
                        return;
                    }
                    isVerstuurd = true;
                    let g1 = geselecteerdeGroepen.slice(0, 3).map(i => woorden[i]).join(", ");
                    let g2 = geselecteerdeGroepen.slice(3, 6).map(i => woorden[i]).join(", ");
                    let g3 = geselecteerdeGroepen.slice(6, 9).map(i => woorden[i]).join(", ");
                    const antwoordTekst = `${g1} | ${g2} | ${g3}`;

                    slaAntwoordOp(index, antwoordTekst);
                    feedbackEl.innerText = `Groepjes opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    updateGroepenUI();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            updateGroepenUI();
        }
        else if (huidige.type === "boodschappen") {
            const origineleLijst = index === 42
                ? ["Stokbrood", "Roomboter", "Champignons", "Champagne", "Gourmetvlees", "Aardappelen", "Glühwein", "Brie"]
                : ["Kerststol", "Rollade", "Zalm", "Bladerdeeg", "Wijn", "Satésaus", "Krieltjes", "Komkommer"];
            let huidigeVolgorde = index === 42
                ? ["Champagne", "Brie", "Stokbrood", "Aardappelen", "Roomboter", "Glühwein", "Champignons", "Gourmetvlees"]
                : ["Bladerdeeg", "Komkommer", "Rollade", "Krieltjes", "Kerststol", "Satésaus", "Zalm", "Wijn"];

            let dragStartIndex = null;

            const renderSleepLijst = () => {
                gebiedEl.innerHTML = `<p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">Sleep de boodschappen in de juiste volgorde (1 t/m 8) of gebruik de pijltjes:</p>`;
                const lijstContainer = document.createElement("div");

                huidigeVolgorde.forEach((item, posIdx) => {
                    const row = document.createElement("div");
                    row.className = "sleep-item";
                    row.draggable = !isVerstuurd;

                    row.ondragstart = () => {
                        if (isVerstuurd) return;
                        dragStartIndex = posIdx;
                        row.classList.add("dragging");
                    };
                    row.ondragend = () => {
                        row.classList.remove("dragging");
                    };
                    row.ondragover = (e) => {
                        e.preventDefault();
                    };
                    row.ondrop = (e) => {
                        e.preventDefault();
                        if (isVerstuurd || dragStartIndex === null || dragStartIndex === posIdx) return;
                        const verplaatst = huidigeVolgorde.splice(dragStartIndex, 1)[0];
                        huidigeVolgorde.splice(posIdx, 0, verplaatst);
                        dragStartIndex = null;
                        renderSleepLijst();
                    };

                    const links = document.createElement("div");
                    links.className = "sleep-item-links";
                    links.innerHTML = `<span class="sleep-nr">${posIdx + 1}</span><span>${item}</span>`;

                    const knoppen = document.createElement("div");
                    knoppen.className = "sleep-knoppen";

                    const omhoogBtn = document.createElement("button");
                    omhoogBtn.type = "button";
                    omhoogBtn.className = "mini-move-btn";
                    omhoogBtn.innerText = "▲";
                    omhoogBtn.disabled = isVerstuurd || posIdx === 0;
                    omhoogBtn.onclick = () => {
                        if (isVerstuurd || posIdx === 0) return;
                        [huidigeVolgorde[posIdx - 1], huidigeVolgorde[posIdx]] = [huidigeVolgorde[posIdx], huidigeVolgorde[posIdx - 1]];
                        renderSleepLijst();
                    };

                    const omlaagBtn = document.createElement("button");
                    omlaagBtn.type = "button";
                    omlaagBtn.className = "mini-move-btn";
                    omlaagBtn.innerText = "▼";
                    omlaagBtn.disabled = isVerstuurd || posIdx === huidigeVolgorde.length - 1;
                    omlaagBtn.onclick = () => {
                        if (isVerstuurd || posIdx === huidigeVolgorde.length - 1) return;
                        [huidigeVolgorde[posIdx + 1], huidigeVolgorde[posIdx]] = [huidigeVolgorde[posIdx], huidigeVolgorde[posIdx + 1]];
                        renderSleepLijst();
                    };

                    knoppen.appendChild(omhoogBtn);
                    knoppen.appendChild(omlaagBtn);
                    row.appendChild(links);
                    row.appendChild(knoppen);
                    lijstContainer.appendChild(row);
                });

                gebiedEl.appendChild(lijstContainer);

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur Volgorde 🎯";
                verstuurKnop.disabled = isVerstuurd;
                verstuurKnop.onclick = () => {
                    isVerstuurd = true;
                    const antwoordTekst = huidigeVolgorde.join(", ");
                    slaAntwoordOp(index, antwoordTekst);
                    feedbackEl.innerText = `Volgorde opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    renderSleepLijst();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            let aftel = 30;
            const renderKijkFase = () => {
                gebiedEl.innerHTML = `
                    <div class="timer-pill">👀 Onthoud de volgorde (${aftel}s)</div>
                    <div class="boodschappen-lijst-view">
                        ${origineleLijst.map((item, i) => `<div class="boodschap-regel"><span>${i + 1}.</span>${item}</div>`).join("")}
                    </div>
                `;
            };

            renderKijkFase();
            spelTimerInterval = setInterval(() => {
                aftel--;
                if (aftel > 0) {
                    renderKijkFase();
                } else if (aftel > -5) {
                    gebiedEl.innerHTML = `<div class="wacht-box">⏳ Even onthouden... (${5 + aftel}s)</div>`;
                } else {
                    clearInterval(spelTimerInterval);
                    spelTimerInterval = null;
                    renderSleepLijst();
                }
            }, 1000);
        }
        else if (huidige.type === "anagram") {
            const letters = index === 44
                ? ["T", "E", "M", "L", "I", "E", "S", "T", "O"]
                : ["R", "E", "S", "E", "N", "A", "L", "E", "R"];
            let geplaatsteIndices = [];

            const renderAnagramUI = () => {
                gebiedEl.innerHTML = `<p style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Tik de letters in de juiste volgorde om het woord te vormen (tik op een vakje om te verwijderen):</p>`;

                const slotsRow = document.createElement("div");
                slotsRow.className = "letter-slots-row";
                for (let s = 0; s < letters.length; s++) {
                    const slot = document.createElement("div");
                    slot.className = "letter-slot";
                    if (s < geplaatsteIndices.length) {
                        slot.innerText = letters[geplaatsteIndices[s]];
                        slot.onclick = () => {
                            if (isVerstuurd) return;
                            geplaatsteIndices.splice(s, 1);
                            renderAnagramUI();
                        };
                    } else {
                        slot.classList.add("leeg");
                        slot.innerText = "_";
                    }
                    slotsRow.appendChild(slot);
                }
                gebiedEl.appendChild(slotsRow);

                const poolRow = document.createElement("div");
                poolRow.className = "letter-pool-row";
                letters.forEach((letter, lIdx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "letter-tegel";
                    btn.innerText = letter;
                    btn.disabled = isVerstuurd || geplaatsteIndices.includes(lIdx);
                    btn.onclick = () => {
                        if (isVerstuurd || geplaatsteIndices.includes(lIdx)) return;
                        geplaatsteIndices.push(lIdx);
                        renderAnagramUI();
                    };
                    poolRow.appendChild(btn);
                });
                gebiedEl.appendChild(poolRow);

                const wisKnop = document.createElement("button");
                wisKnop.type = "button";
                wisKnop.className = "btn btn-secundair";
                wisKnop.style.padding = "10px";
                wisKnop.style.fontSize = "13px";
                wisKnop.innerText = "Letters opnieuw plaatsen ↺";
                wisKnop.disabled = isVerstuurd || geplaatsteIndices.length === 0;
                wisKnop.onclick = () => {
                    if (isVerstuurd) return;
                    geplaatsteIndices = [];
                    renderAnagramUI();
                };
                gebiedEl.appendChild(wisKnop);

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur Antwoord 🎯";
                verstuurKnop.disabled = isVerstuurd;
                verstuurKnop.onclick = () => {
                    if (geplaatsteIndices.length < letters.length) {
                        alert("Gebruik alle 9 letters om het woord te vormen voordat je verstuurt!");
                        return;
                    }
                    isVerstuurd = true;
                    const gevormdWoord = geplaatsteIndices.map(i => letters[i]).join("");
                    slaAntwoordOp(index, gevormdWoord);
                    feedbackEl.innerText = `Woord (${gevormdWoord}) opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    renderAnagramUI();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            renderAnagramUI();
        }
        else if (huidige.type === "emoticons_geheugen") {
            const emoticons12 = index === 46
                ? ["🎄", "⛄", "🦌", "🎁", "🔔", "🧦", "🕯️", "🍪", "⭐", "🎅", "❄️", "🎀"]
                : ["🎅", "🍪", "🎀", "🎄", "⭐", "🧦", "⛄", "🕯️", "❄️", "🔔", "🦌", "🎁"];
            const emoticons16 = index === 46
                ? ["🎄", "🌟", "⛄", "🍷", "🦌", "🎁", "🔔", "🧦", "🛷", "🕯️", "🍪", "⭐", "🎅", "❄️", "🎀", "🎶"]
                : ["🎅", "🍪", "🎀", "🥂", "🎄", "🧣", "⭐", "🧦", "⛄", "🕯️", "❄️", "👼", "🔔", "🎺", "🦌", "🎁"];

            const renderSelectieUI = () => {
                gebiedEl.innerHTML = `<p style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Selecteer de 4 emoticons die erbij zijn gekomen (${geselecteerdeEmoticons.length}/4):</p>`;
                const grid = document.createElement("div");
                grid.className = "emoticon-grid-deelnemer";

                emoticons16.forEach((em) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "emoticon-kies-btn";
                    if (geselecteerdeEmoticons.includes(em)) {
                        btn.classList.add("selected");
                    }
                    btn.innerText = em;
                    btn.disabled = isVerstuurd;
                    btn.onclick = () => {
                        if (isVerstuurd) return;
                        const pos = geselecteerdeEmoticons.indexOf(em);
                        if (pos !== -1) {
                            geselecteerdeEmoticons.splice(pos, 1);
                        } else {
                            if (geselecteerdeEmoticons.length >= 4) {
                                alert("Je mag maximaal 4 emoticons selecteren! Tik eerst een geselecteerde uit.");
                                return;
                            }
                            geselecteerdeEmoticons.push(em);
                        }
                        renderSelectieUI();
                    };
                    grid.appendChild(btn);
                });

                gebiedEl.appendChild(grid);

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur 4 Emoticons 🎯";
                verstuurKnop.disabled = isVerstuurd;
                verstuurKnop.onclick = () => {
                    if (geselecteerdeEmoticons.length !== 4) {
                        alert("Selecteer precies 4 emoticons voordat je verstuurt!");
                        return;
                    }
                    isVerstuurd = true;
                    const antwoordTekst = geselecteerdeEmoticons.join(", ");
                    slaAntwoordOp(index, antwoordTekst);
                    feedbackEl.innerText = `Gekozen (${antwoordTekst}) opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    renderSelectieUI();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            let aftel = 30;
            const renderEmoticonKijkFase = () => {
                gebiedEl.innerHTML = `
                    <div class="timer-pill">👀 Onthoud deze 12 emoticons (${aftel}s)</div>
                    <div class="emoticon-grid-deelnemer">
                        ${emoticons12.map(em => `<div class="emoticon-kijk-vak">${em}</div>`).join("")}
                    </div>
                `;
            };

            renderEmoticonKijkFase();
            spelTimerInterval = setInterval(() => {
                aftel--;
                if (aftel > 0) {
                    renderEmoticonKijkFase();
                } else if (aftel > -5) {
                    gebiedEl.innerHTML = `<div class="wacht-box">⏳ Even geduld... (${5 + aftel}s)</div>`;
                } else {
                    clearInterval(spelTimerInterval);
                    spelTimerInterval = null;
                    renderSelectieUI();
                }
            }, 1000);
        }
    }
</script>

</body>
</html>
