<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerstquiz - Deelnemer Scherm</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0a1710;
            --card-bg: rgba(19, 46, 33, 0.92);
            --card-border: #d4af37;
            --primary-red: #8b0000;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at center, #1b3022 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }
        .snow-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px #fff;
            user-select: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
        .deelnemer-card {
            background: var(--card-bg);
            padding: 40px 25px 25px 25px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 40px rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 3px solid var(--card-border);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(8px);
        }
        .card-decor-top {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: url("elementen/deelnemer/gouden_cadeau.png") no-repeat center center;
            background-size: contain;
            z-index: 10;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background-color: #1e3a2f;
            color: white;
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 6px 0 #0f2019, 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.15s ease;
        }
        .btn:hover { transform: translateY(-2px); border-color: var(--card-border); box-shadow: 0 8px 0 #0f2019, 0 10px 20px rgba(0,0,0,0.4); }
        .btn-optie-0 { background-color: #991b1b; box-shadow: 0 6px 0 #7f1d1d, 0 8px 15px rgba(0,0,0,0.3); }
        .btn-optie-1 { background-color: #166534; box-shadow: 0 6px 0 #14532d, 0 8px 15px rgba(0,0,0,0.3); }
        .btn-optie-2 { background-color: #b45309; box-shadow: 0 6px 0 #92400e, 0 8px 15px rgba(0,0,0,0.3); }
        .btn-optie-3 { background-color: #1e3a8a; box-shadow: 0 6px 0 #1e3a8a, 0 8px 15px rgba(0,0,0,0.3); }
        .btn-secundair { background-color: #27374d; border-color: #526d82; box-shadow: 0 6px 0 #1b263b, 0 8px 15px rgba(0,0,0,0.2); }
        .btn-verstuur { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #0a1710; border: 2px solid #fef3c7; font-weight: 900; box-shadow: 0 6px 0 #b45309, 0 8px 15px rgba(245, 158, 11, 0.3); margin-top: 15px; }
        input[type="text"] { width: 100%; padding: 16px; font-size: 18px; margin: 15px 0; text-align: center; border: 2px solid var(--card-border); border-radius: 14px; box-sizing: border-box; background: #08120c; font-weight: 700; color: var(--text-light); }
        input:focus { border-color: #f59e0b; outline: none; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        #status-bericht { font-size: 13px; color: var(--accent-gold); margin-bottom: 8px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
        #vraag-titel { font-size: 19px; margin-bottom: 25px; line-height: 1.5; text-align: left; white-space: pre-line; font-weight: 700; color: var(--text-light); }
        .volgorde-item { background: #1b3d2f; padding: 14px; margin: 10px 0; border-radius: 12px; cursor: pointer; border: 2px solid rgba(212, 175, 55, 0.3); text-align: left; font-size: 15px; font-weight: 700; }
        .volgorde-item.selected { background: #14532d; border-color: #4ade80; color: #dcfce7; }
        .groepen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
        .groep-woord-btn { background: #1b3d2f; color: #f8fafc; border: 2px solid rgba(212, 175, 55, 0.35); border-radius: 10px; padding: 12px 6px; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.15s ease; word-break: break-word; }
        .groep-woord-btn.groep-0 { background: #991b1b; border-color: #fca5a5; color: #fff; }
        .groep-woord-btn.groep-1 { background: #166534; border-color: #86efac; color: #fff; }
        .groep-woord-btn.groep-2 { background: #1e3a8a; border-color: #93c5fd; color: #fff; }
        #feedback { font-weight: 800; margin-top: 15px; font-size: 16px; }
        .antwoord-item-einde { padding: 10px 12px; margin: 8px 0; border-radius: 10px; text-align: left; font-size: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="snow-container" id="snow"></div>

<div class="deelnemer-card">
    <div class="card-decor-top"></div>
    <div id="status-bericht">✨ Kerst Lobby ✨</div>
    <div id="vraag-titel">Vul je naam in om mee te doen met de Kerstquiz! 🎄</div>
    <div id="antwoord-gebied">
        <input type="text" id="deelnemer-naam" placeholder="Jouw naam...">
        <button class="btn btn-secundair" onclick="registreerDeelnemer()">Meedoen! 🚀</button>
    </div>
    <p id="feedback"></p>
    <div id="extra-opties" style="margin-top: 20px;"></div>
</div>

<script>
    const socket = io();

    const snowContainer = document.getElementById('snow');
    const snowflakeChars = ['❄', '❅', '❆', '•', '✨'];
    for (let i = 0; i < 35; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.innerText = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
        flake.style.animationDelay = (Math.random() * 5) + 's';
        flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
        snowContainer.appendChild(flake);
    }

    const vragenData = [
        // Ronde 1 (index 0 t/m 7)
        { type: "keuze", juist: "B) Duitsland", ronde: 1 },
        { type: "keuze", juist: "C) 4", ronde: 1 },
        { type: "keuze", juist: "A) Mexico", ronde: 1 },
        { type: "tekst", juist: "Sinterklaas", ronde: 1 },
        { type: "getal", juist: "6", ronde: 1 },
        { type: "tekst", juist: "Drenthe", ronde: 1 },
        { type: "keuze", juist: "Waar", ronde: 1 },
        { type: "keuze", juist: "Niet waar", ronde: 1 },

        // Ronde 5 (index 8 t/m 15)
        { type: "tekst", juist: "Stille Nacht", ronde: 5 },
        { type: "tekst", juist: "The Polar Express", ronde: 5 },
        { type: "keuze", juist: "O) Met de overige letters kan het woord 'kaars' gevormd worden.", ronde: 5 },
        { type: "keuze", juist: "A) Met de overige letters kan het woord 'slinger' gevormd worden.", ronde: 5 },
        { type: "tekst", juist: "kerstballen", ronde: 5 },
        { type: "tekst", juist: "rendieren", ronde: 5 },
        { type: "groepen", juist: "Rendieren: Blitzen, Vixen, Dasher | Kerstverhaal: Stal, Herberg, Ster | Kerstliedjes: Jingle Bells, Stille Nacht, Last Christmas", ronde: 5 },
        { type: "groepen", juist: "Kerstfilms: Home Alone, Elf, The Polar Express | Mopperkonten: Grinch, Scrooge, Jack Frost | Wijzen: Goud, Wierook, Mirre", ronde: 5 },

        // Ronde 8 (index 16 t/m 27)
        { type: "getal", juist: "2.500.000", ronde: 8 },
        { type: "getal", juist: "€325", ronde: 8 },
        { type: "volgorde", juist: "B -> D -> C -> A", ronde: 8 },
        { type: "volgorde", juist: "D -> B -> A -> C", ronde: 8 },
        { type: "keuze", juist: "Waar", ronde: 8 },
        { type: "keuze", juist: "Niet waar", ronde: 8 },
        { type: "getal", juist: "85%", ronde: 8 },
        { type: "getal", juist: "25%", ronde: 8 },
        { type: "keuze", juist: "C) Drenthe", ronde: 8 },
        { type: "keuze", juist: "C) 23 december", ronde: 8 },
        { type: "keuze", juist: "A) 44,7 meter", ronde: 8 },
        { type: "keuze", juist: "C) 30–40 dagen", ronde: 8 }
    ];

    let geselecteerdeVolgorde = [];
    let geselecteerdeGroepen = [];
    let isVerstuurd = false;
    let huidigeVraagIndex = -1;
    let toonEindstandStatus = false;
    let mijnNaam = "";
    let serverAntwoorden = {};

    socket.on('update-status', (data) => {
        huidigeVraagIndex = data.huidigeVraagIndex;
        toonEindstandStatus = data.toonEindstand;
        if (data.alleAntwoorden) {
            serverAntwoorden = data.alleAntwoorden;
        }
        toonDeelnemerVraag(huidigeVraagIndex);
    });

    socket.on('zet-vraag', (nieuweIndex) => {
        huidigeVraagIndex = nieuweIndex;
        toonEindstandStatus = false;
        toonDeelnemerVraag(huidigeVraagIndex);
    });

    socket.on('update-ingezonden', (data) => {
        if (data.alleAntwoorden) {
            serverAntwoorden = data.alleAntwoorden;
        }
    });

    socket.on('quiz-gereset', () => {
        huidigeVraagIndex = -1;
        toonEindstandStatus = false;
        mijnNaam = "";
        serverAntwoorden = {};
        localStorage.removeItem("huidigeDeelnemerNaam");
        toonDeelnemerVraag(-1);
    });

    function registreerDeelnemer() {
        const inputVal = document.getElementById("deelnemer-naam").value.trim();
        if (!inputVal) {
            alert("Vul alstublieft je naam in!");
            return;
        }
        mijnNaam = inputVal;
        localStorage.setItem("huidigeDeelnemerNaam", mijnNaam);
        socket.emit('registreer-deelnemer', mijnNaam);
        toonDeelnemerVraag(huidigeVraagIndex);
    }

    function wisNaam() {
        mijnNaam = "";
        localStorage.removeItem("huidigeDeelnemerNaam");
        toonDeelnemerVraag(-1);
    }

    function slaAntwoordOp(vraagIndex, antwoordTekst) {
        socket.emit('sla-antwoord op', {
            naam: mijnNaam,
            vraagIndex: vraagIndex,
            antwoord: antwoordTekst
        });
    }

    function vergelijkMetSpelfout(gegeven, juist) {
        let a = String(gegeven || "").trim().toLowerCase();
        let b = String(juist || "").trim().toLowerCase();
        
        a = a.replace(/^[.]+|[.]+$/g, "").trim();
        b = b.replace(/^[.]+|[.]+$/g, "").trim();

        if (a === b) return true;

        let levenshtein = (str1, str2) => {
            let track = Array(str2.length + 1).fill(null).map(() =>
                Array(str1.length + 1).fill(null));
            for (let i = 0; i <= str1.length; i += 1) { track[0][i] = i; }
            for (let j = 0; j <= str2.length; j += 1) { track[j][0] = j; }
            for (let j = 1; j <= str2.length; j += 1) {
                for (let i = 1; i <= str1.length; i += 1) {
                    let indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1,
                        track[j - 1][i] + 1,
                        track[j - 1][i - 1] + indicator
                    );
                }
            }
            return track[str2.length][str1.length];
        };

        return levenshtein(a, b) <= 2;
    }

    function controleerGroepen(antw, verwachteGroepen) {
        if (!antw) return false;
        let groepen = String(antw).toLowerCase().split('|').map(g =>
            g.split(',').map(w => w.trim()).filter(Boolean).sort().join(',')
        ).filter(Boolean).sort();
        let verwacht = verwachteGroepen.map(g =>
            g.map(w => w.toLowerCase().trim()).sort().join(',')
        ).sort();
        return groepen.length === 3 && groepen.every((val, idx) => val === verwacht[idx]);
    }

    function isAntwoordJuistDeelnemer(index, antw) {
        if (!antw) return false;
        let a = String(antw).trim().toLowerCase();

        switch(index) {
            case 0: return a.startsWith("b") || a.includes("duitsland");
            case 1: return a.startsWith("c") || a === "4";
            case 2: return a.startsWith("a") || a.includes("mexico");
            case 3: return vergelijkMetSpelfout(a, "Sinterklaas");
            case 4: return a === "6" || a.includes("zes");
            case 5: return vergelijkMetSpelfout(a, "Drenthe");
            case 6: return a.includes("waar") && !a.includes("niet");
            case 7: return a.includes("niet waar");

            case 8: return vergelijkMetSpelfout(a, "Stille Nacht");
            case 9: return vergelijkMetSpelfout(a, "The Polar Express") || vergelijkMetSpelfout(a, "Polar Express");
            case 10: return a.startsWith("o") || a.includes("kaars");
            case 11: return a.startsWith("a") || a.includes("slinger");
            case 12: return vergelijkMetSpelfout(a, "kerstballen") || vergelijkMetSpelfout(a, "kerstbal");
            case 13: return vergelijkMetSpelfout(a, "rendieren") || vergelijkMetSpelfout(a, "rendier");
            case 14: return controleerGroepen(a, [
                ["blitzen", "vixen", "dasher"],
                ["stal", "herberg", "ster"],
                ["jingle bells", "stille nacht", "last christmas"]
            ]);
            case 15: return controleerGroepen(a, [
                ["home alone", "elf", "the polar express"],
                ["grinch", "scrooge", "jack frost"],
                ["goud", "wierook", "mirre"]
            ]);

            case 16:
                let num1 = parseFloat(a.replace(/[^0-9.]/g, ''));
                if (num1 < 100) num1 = num1 * 1000000;
                return !isNaN(num1) && num1 >= 2250000 && num1 <= 2750000;
            case 17:
                let num2 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num2) && num2 >= 300 && num2 <= 350;
            case 18: return a.replace(/[^a-z]/gi, '').toLowerCase() === "bdca";
            case 19: return a.replace(/[^a-z]/gi, '').toLowerCase() === "dbac";
            case 20: return a.includes("waar") && !a.includes("niet");
            case 21: return a.includes("niet waar");
            case 22:
                let num6 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num6) && num6 >= 80 && num6 <= 90;
            case 23:
                let num7 = parseFloat(a.replace(/[^0-9.]/g, ''));
                return !isNaN(num7) && num7 >= 20 && num7 <= 30;
            case 24: return a.startsWith("c") || a.includes("drenthe");
            case 25: return a.startsWith("c") || a.includes("23");
            case 26: return a.startsWith("a") || a.includes("44,7");
            case 27: return a.startsWith("c") || a.includes("30–40");
            default: return false;
        }
    }

    function toonDeelnemerVraag(index) {
        const statusEl = document.getElementById("status-bericht");
        const titelEl = document.getElementById("vraag-titel");
        const gebiedEl = document.getElementById("antwoord-gebied");
        const feedbackEl = document.getElementById("feedback");
        const extraOptiesEl = document.getElementById("extra-opties");

        if (!mijnNaam) {
            mijnNaam = localStorage.getItem("huidigeDeelnemerNaam") || "";
        }

        feedbackEl.innerText = "";
        geselecteerdeVolgorde = [];
        geselecteerdeGroepen = [];
        isVerstuurd = false;
        extraOptiesEl.innerHTML = "";
        titelEl.style.display = "block";

        if (index < 0) {
            statusEl.innerText = "✨ Kerst Lobby ✨";
            if (!mijnNaam) {
                titelEl.innerText = "Vul je naam in om mee te doen met de Kerstquiz! 🎄";
                gebiedEl.innerHTML = `
                    <input type="text" id="deelnemer-naam" placeholder="Jouw naam...">
                    <button class="btn btn-secundair" onclick="registreerDeelnemer()">Meedoen! 🚀</button>
                `;
            } else {
                titelEl.innerText = `Welkom ${mijnNaam}! Je bent klaar om mee te doen. Wacht tot de host de quiz start... 🎅`;
                gebiedEl.innerHTML = `<p style="color:#4ade80; font-weight:800; font-size:18px;">Aangemeld als: ${mijnNaam}</p>`;
                extraOptiesEl.innerHTML = `<button class="btn btn-secundair" style="font-size:13px; padding:10px;" onclick="wisNaam()">Wissel van naam</button>`;
            }
            return;
        }

        if (toonEindstandStatus) {
            statusEl.innerText = "🎄 QUIZ AFGESLOTEN 🎄";
            titelEl.style.display = "none";
            gebiedEl.innerHTML = `
                <div style="padding: 20px 0; text-align: center;">
                    <p style="font-size: 18px; font-weight: 800; color: var(--text-light); line-height: 1.6; margin: 0;">
                        De kerstquiz is afgelopen.<br>Bedankt voor het spelen. 🌟
                    </p>
                </div>
            `;
            return;
        }

        if (index === 8) {
            statusEl.innerText = "✨ RESULTATEN RONDE 1 ✨";
            titelEl.style.display = "none";

            let mijnAntwoorden = serverAntwoorden[mijnNaam] || {};
            let rondeGoed = 0;
            let overzichtHtml = "<div style='max-height:300px; overflow-y:auto; padding-right:5px;'>";
            
            for (let vIdx = 0; vIdx < 8; vIdx++) {
                let antw = mijnAntwoorden[vIdx] !== undefined ? mijnAntwoorden[vIdx] : "<em>Geen antwoord</em>";
                let goed = isAntwoordJuistDeelnemer(vIdx, mijnAntwoorden[vIdx]);
                if (goed) rondeGoed++;

                let icoon = goed ? "✅ Goed" : "❌ Fout";
                let achtergrond = goed ? "#14532d" : "#7f1d1d";
                let randKleur = goed ? "#4ade80" : "#f87171";

                overzichtHtml += `<div class="antwoord-item-einde" style="background-color: ${achtergrond}; color: #fff; border: 2px solid ${randKleur};">
                    <strong>Vraag ${vIdx + 1}:</strong> ${icoon}<br>
                    Jouw antwoord: <strong>${antw}</strong><br>
                    <span style="color: #cbd5e1; font-size: 11px; font-weight:600;">Juist antwoord: ${vragenData[vIdx].juist}</span>
                </div>`;
            }
            overzichtHtml += `</div><p style='margin-top:12px; font-weight:900; font-size:16px; color:var(--accent-gold); margin-bottom: 0;'>Score Ronde 1: ${rondeGoed} / 8 goed! 🌟</p><p style='color:var(--text-muted); font-size:13px; margin-top:8px;'>Wacht op de host om door te gaan naar Ronde 5...</p>`;
            
            gebiedEl.innerHTML = overzichtHtml;
            return;
        }

        if (index === 16) {
            statusEl.innerText = "✨ RESULTATEN RONDE 5 ✨";
            titelEl.style.display = "none";

            let mijnAntwoorden = serverAntwoorden[mijnNaam] || {};
            let rondeGoed = 0;
            let overzichtHtml = "<div style='max-height:300px; overflow-y:auto; padding-right:5px;'>";
            
            for (let vIdx = 8; vIdx < 16; vIdx++) {
                let antw = mijnAntwoorden[vIdx] !== undefined ? mijnAntwoorden[vIdx] : "<em>Geen antwoord</em>";
                let goed = isAntwoordJuistDeelnemer(vIdx, mijnAntwoorden[vIdx]);
                if (goed) rondeGoed++;

                let icoon = goed ? "✅ Goed" : "❌ Fout";
                let achtergrond = goed ? "#14532d" : "#7f1d1d";
                let randKleur = goed ? "#4ade80" : "#f87171";

                overzichtHtml += `<div class="antwoord-item-einde" style="background-color: ${achtergrond}; color: #fff; border: 2px solid ${randKleur};">
                    <strong>Vraag ${vIdx - 7}:</strong> ${icoon}<br>
                    Jouw antwoord: <strong>${antw}</strong><br>
                    <span style="color: #cbd5e1; font-size: 11px; font-weight:600;">Juist antwoord: ${vragenData[vIdx].juist}</span>
                </div>`;
            }
            overzichtHtml += `</div><p style='margin-top:12px; font-weight:900; font-size:16px; color:var(--accent-gold); margin-bottom: 0;'>Score Ronde 5: ${rondeGoed} / 8 goed! 🌟</p><p style='color:var(--text-muted); font-size:13px; margin-top:8px;'>Wacht op de host om door te gaan naar Ronde 8...</p>`;
            
            gebiedEl.innerHTML = overzichtHtml;
            return;
        }

        if (index >= vragenData.length) {
            statusEl.innerText = "✨ JOUW RESULTATEN RONDE 8 & EINDSTAND ✨";
            titelEl.style.display = "none";

            let mijnAntwoorden = serverAntwoorden[mijnNaam] || {};
            let totaalGoed = 0;
            let overzichtHtml = "<div style='max-height:300px; overflow-y:auto; padding-right:5px;'>";
            
            for (let vIdx = 16; vIdx < vragenData.length; vIdx++) {
                let antw = mijnAntwoorden[vIdx] !== undefined ? mijnAntwoorden[vIdx] : "<em>Geen antwoord</em>";
                let goed = isAntwoordJuistDeelnemer(vIdx, mijnAntwoorden[vIdx]);
                if (goed) totaalGoed++;

                let icoon = goed ? "✅ Goed" : "❌ Fout";
                let achtergrond = goed ? "#14532d" : "#7f1d1d";
                let randKleur = goed ? "#4ade80" : "#f87171";

                overzichtHtml += `<div class="antwoord-item-einde" style="background-color: ${achtergrond}; color: #fff; border: 2px solid ${randKleur};">
                    <strong>Vraag ${vIdx - 15}:</strong> ${icoon}<br>
                    Jouw antwoord: <strong>${antw}</strong><br>
                    <span style="color: #cbd5e1; font-size: 11px; font-weight:600;">Juist antwoord: ${vragenData[vIdx].juist}</span>
                </div>`;
            }
            overzichtHtml += `</div><p style='margin-top:12px; font-weight:900; font-size:16px; color:var(--accent-gold); margin-bottom: 0;'>Score Ronde 8: ${totaalGoed} / 12 goed! 🌟</p>`;
            
            gebiedEl.innerHTML = overzichtHtml;
            return;
        }

        titelEl.style.display = "none";

        const huidige = vragenData[index];
        let vraagNummerInRonde = huidige.ronde === 1 ? index + 1 : (huidige.ronde === 5 ? index - 7 : index - 15);
        let totaalInRonde = huidige.ronde === 8 ? 12 : 8;
        statusEl.innerText = `SPELER: ${mijnNaam} | RONDE ${huidige.ronde} | VRAAG ${vraagNummerInRonde} / ${totaalInRonde}`;
        gebiedEl.innerHTML = "";

        if (huidige.type === "getal" || huidige.type === "tekst") {
            const input = document.createElement("input");
            input.type = "text";
            if (huidige.type === "getal") {
                input.inputMode = "numeric";
                input.oninput = () => { input.value = input.value.replace(/[^0-9]/g, ''); };
            }
            input.placeholder = huidige.type === "getal" ? "Typ je cijfer..." : "Typ je antwoord...";
            
            const knop = document.createElement("button");
            knop.innerText = "Verstuur Antwoord 🎯";
            knop.className = "btn btn-verstuur";
            knop.onclick = () => {
                let schoneWaarde = input.value.trim();
                if(!schoneWaarde) {
                    alert("Vul alstublieft een antwoord in!");
                    return;
                }
                slaAntwoordOp(index, schoneWaarde);
                feedbackEl.innerText = `Antwoord (${schoneWaarde}) opgeslagen! Wacht op de host...`;
                feedbackEl.style.color = "#4ade80";
                input.disabled = true;
                knop.disabled = true;
            };

            gebiedEl.appendChild(input);
            gebiedEl.appendChild(knop);
        }
        else if (huidige.type === "keuze") {
            const optiesMap = {
                0: ["A) Engeland", "B) Duitsland", "C) Zweden", "D) Nederland"],
                1: ["A) 2", "B) 3", "C) 4", "D) 5"],
                2: ["A) Mexico", "B) Zuid-Afrika", "C) India", "D) Spanje"],
                6: ["Waar", "Niet waar"],
                7: ["Waar", "Niet waar"],
                10: ["K", "A", "O", "R", "S"],
                11: ["S", "L", "I", "A", "N", "G", "E", "R"],
                20: ["Waar", "Niet waar"],
                21: ["Waar", "Niet waar"],
                24: ["A) Zuid-Holland", "B) Friesland", "C) Drenthe", "D) Noord-Holland"],
                25: ["A) 21 december", "B) 22 december", "C) 23 december", "D) 24 december"],
                26: ["A) 44,7 meter", "B) 64,6 meter", "C) 53,4 meter", "D) 71,2 meter"],
                27: ["A) 10–20 dagen", "B) 20–30 dagen", "C) 30–40 dagen", "D) 40–50 dagen"]
            };

            let opties = optiesMap[index] || [];
            opties.forEach((optie, optieIdx) => {
                const knop = document.createElement("button");
                knop.innerText = optie;
                knop.className = `btn btn-optie-${optieIdx % 4}`;
                knop.onclick = () => {
                    slaAntwoordoptieOp(index, optie);
                    feedbackEl.innerText = `Gekozen: ${optie}. Opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    const alleKnoppen = gebiedEl.getElementsByTagName("button");
                    for (let k of alleKnoppen) k.disabled = true;
                };
                gebiedEl.appendChild(knop);
            });
            
            function slaAntwoordoptieOp(idx, val) {
                slaAntwoordOp(idx, val);
            }
        }
        else if (huidige.type === "volgorde") {
            const volgordeOpties = index === 18 ? [
                "A) Rudolph het roodneuzige rendier...",
                "B) In een gedicht verschijnen rendieren...",
                "C) Coca-Cola lanceert reclamecampagne...",
                "D) Louis Prang massaproductie kerstkaarten."
            ] : [
                "A) Edward Johnson elektrische lampjes",
                "B) De eerste commerciële kerstkaart Sir Henry Cole",
                "C) De eerste kunstkerstbomen",
                "D) Adventskrans Johann Wichern"
            ];

            const updateVolgordeUI = () => {
                gebiedEl.innerHTML = "";
                volgordeOpties.forEach((optie, optieIndex) => {
                    const div = document.createElement("div");
                    div.className = "volgorde-item";
                    if (isVerstuurd) div.classList.add("disabled");
                    
                    let positie = geselecteerdeVolgorde.indexOf(optieIndex);
                    if (positie !== -1) {
                        div.classList.add("selected");
                        div.innerText = `${optie} (Stap ${positie + 1})`;
                    } else {
                        div.innerText = optie;
                    }

                    div.onclick = () => {
                        if (isVerstuurd) return;
                        let alGekozenIndex = geselecteerdeVolgorde.indexOf(optieIndex);
                        if (alGekozenIndex !== -1) {
                            geselecteerdeVolgorde.splice(alGekozenIndex, 1);
                        } else {
                            geselecteerdeVolgorde.push(optieIndex);
                        }
                        updateVolgordeUI();
                    };
                    gebiedEl.appendChild(div);
                });

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur Antwoord 🎯";
                if (isVerstuurd) verstuurKnop.disabled = true;

                verstuurKnop.onclick = () => {
                    if (geselecteerdeVolgorde.length < volgordeOpties.length) {
                        alert(`Selecteer alle ${volgordeOpties.length} opties in de gewenste volgorde voordat je verstuurt!`);
                        return;
                    }
                    isVerstuurd = true;
                    const volgordeTekst = geselecteerdeVolgorde.map(i => String.fromCharCode(65 + i)).join(" -> ");
                    slaAntwoordOp(index, volgordeTekst);
                    feedbackEl.innerText = `Volgorde (${volgordeTekst}) opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    updateVolgordeUI();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            updateVolgordeUI();
        }
        else if (huidige.type === "groepen") {
            const woorden = index === 14 ? [
                "BLITZEN", "STAL", "JINGLE BELLS",
                "VIXEN", "HERBERG", "STILLE NACHT",
                "DASHER", "STER", "LAST CHRISTMAS"
            ] : [
                "HOME ALONE", "GOUD", "ELF",
                "GRINCH", "WIEROOK", "SCROOGE",
                "THE POLAR EXPRESS", "JACK FROST", "MIRRE"
            ];

            const updateGroepenUI = () => {
                gebiedEl.innerHTML = `<p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">Tik telkens 3 woorden aan die bij elkaar horen (Groep 1 = rood, Groep 2 = groen, Groep 3 = blauw):</p>`;
                const grid = document.createElement("div");
                grid.className = "groepen-grid";

                woorden.forEach((woord, wIdx) => {
                    const btn = document.createElement("button");
                    btn.className = "groep-woord-btn";
                    btn.innerText = woord;

                    let pos = geselecteerdeGroepen.indexOf(wIdx);
                    if (pos !== -1) {
                        let groepNr = Math.floor(pos / 3);
                        btn.classList.add(`groep-${groepNr}`);
                        btn.innerText = `${woord}\n(Groep ${groepNr + 1})`;
                    }

                    btn.onclick = () => {
                        if (isVerstuurd) return;
                        let alPos = geselecteerdeGroepen.indexOf(wIdx);
                        if (alPos !== -1) {
                            geselecteerdeGroepen.splice(alPos, 1);
                        } else {
                            geselecteerdeGroepen.push(wIdx);
                        }
                        updateGroepenUI();
                    };
                    grid.appendChild(btn);
                });

                gebiedEl.appendChild(grid);

                const verstuurKnop = document.createElement("button");
                verstuurKnop.className = "btn btn-verstuur";
                verstuurKnop.innerText = "Verstuur Antwoord 🎯";
                if (isVerstuurd) verstuurKnop.disabled = true;

                verstuurKnop.onclick = () => {
                    if (geselecteerdeGroepen.length < 9) {
                        alert("Verdeel alle 9 woorden in 3 groepjes van 3 voordat je verstuurt!");
                        return;
                    }
                    isVerstuurd = true;
                    let g1 = geselecteerdeGroepen.slice(0, 3).map(i => woorden[i]).join(", ");
                    let g2 = geselecteerdeGroepen.slice(3, 6).map(i => woorden[i]).join(", ");
                    let g3 = geselecteerdeGroepen.slice(6, 9).map(i => woorden[i]).join(", ");
                    const antwoordTekst = `${g1} | ${g2} | ${g3}`;

                    slaAntwoordOp(index, antwoordTekst);
                    feedbackEl.innerText = `Groepjes opgeslagen! Wacht op de host...`;
                    feedbackEl.style.color = "#4ade80";
                    updateGroepenUI();
                };
                gebiedEl.appendChild(verstuurKnop);
            };

            updateGroepenUI();
        }
    }
</script>

</body>
</html>
